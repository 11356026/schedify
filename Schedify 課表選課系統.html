<html lang="zh-Hant">
<head>

<title>Schedify 課表選課系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#1f1f1f;--line:#333;--ink:#eee;--mut:#9a9a9a;--brand:#bbb;--active:#2c2c2c;--sage:#2c3a36;--field:#161616;--btn:#9a9a9a;--btn-ink:#111;--purple:#a392ee;--teal:#5f9c96;--blk:#333;--lbg:#101010;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--card:#1f1f1f;--line:#333;--ink:#eee;--mut:#9a9a9a;--brand:#bbb;--active:#2c2c2c;--sage:#2c3a36;--field:#161616;--btn:#9a9a9a;--btn-ink:#111;--purple:#a392ee;--teal:#5f9c96;--blk:#333;--lbg:#101010;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--lbg);position:relative;overflow:hidden;padding:24px}
.login:before,.login:after{content:"";position:absolute;border-radius:50%}
.login:before{width:440px;height:440px;left:-120px;top:-130px;background:#d9d0f5;opacity:.7}
.login:after{width:360px;height:360px;right:-100px;bottom:-110px;background:#c7dcf7;opacity:.7}
.lcard{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:26px 30px 14px;box-shadow:0 20px 50px rgba(0,0,0,.14);text-align:left}
.logo{width:42px;height:42px;border-radius:50%;background:var(--purple);color:#fff;font:700 19px/42px "Noto Sans TC",sans-serif;text-align:center;margin:0 auto}
.lcard .bn{font-size:25px;font-weight:700;text-align:center;margin:6px 0 0;line-height:1.2}
.lcard .bs{text-align:center;color:var(--mut);margin:0 0 18px;font-size:13px}
.lcard h1{font-size:19px;margin:0}
.lcard p.d{color:var(--mut);margin:0 0 14px;font-size:13px}
.lcard label{display:block;font-weight:700;margin:0 0 5px;font-size:13px}
.lcard .in{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--field);margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:12px}
.row a{color:var(--purple);font-weight:700;text-decoration:none}
.go{width:100%;height:44px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;font-size:15px}
.foot{text-align:center;color:var(--mut);font-size:11px;margin:10px 0 0}
.err{color:var(--bad);margin:-4px 0 6px;min-height:16px;font-size:12px}
/* app shell */
.hd{height:78px;background:var(--card);display:flex;align-items:center;padding:0 34px;gap:22px;border-bottom:1px solid var(--line)}
.hd b{font-size:24px;color:var(--brand)}
.hd .s{color:var(--mut)}
.hd .u{margin-left:auto;display:flex;gap:14px;align-items:center}
.hd .u i{width:1px;height:16px;background:var(--mut);opacity:.6}
.hd button{border:0;background:none;color:var(--mut);text-decoration:underline;padding:0}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 78px)}
nav{background:var(--card);padding:48px 18px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line)}
nav a{display:block;padding:10px 18px;border-radius:10px;color:var(--ink);text-decoration:none;white-space:nowrap}
nav a:before{content:"• ";color:var(--mut)}
nav a.on{background:var(--active)}
main{padding:36px 40px 56px;min-width:0}
main.wide{max-width:1180px}
h2{font-size:30px;margin:0;line-height:1.3}
.sub{color:var(--mut);margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 28px;margin-bottom:22px;min-width:0}
.pill{display:inline-block;background:var(--active);border-radius:999px;padding:3px 18px;font-size:12px;font-weight:700;color:var(--mut);border:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:22px;margin-bottom:22px}
.grid3 .card{margin:0;min-height:130px}
.big{font-size:34px;font-weight:700;margin-top:8px}
.info{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:70px}
.info span{margin-right:30px}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:16px}
.q a{background:var(--active);border-radius:14px;padding:20px;text-decoration:none;color:var(--ink);display:block}
.q b{display:block;font-size:17px}.q small{color:var(--mut)}
.filt{background:var(--sage);border-radius:20px;padding:24px 32px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px;margin-bottom:34px}
.filt label{font-weight:700;display:block;margin-bottom:8px}
.filt input,.filt select{width:100%;height:46px;border:0;border-radius:10px;background:var(--field);padding:0 14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-weight:700;color:var(--ink);padding:10px 8px;font-size:13px}
td{padding:14px 8px;border-top:1px solid var(--line)}
td.nm{font-weight:700}
.btn{border:0;border-radius:999px;background:var(--active);padding:4px 18px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--btn);color:var(--btn-ink)}
.pri{border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:14px 0;width:270px}
.tt{display:grid;grid-template-columns:90px repeat(5,minmax(110px,1fr));gap:4px;min-width:700px}
.tt div{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:50px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--mut)}
.tt .h{background:var(--active);min-height:40px;color:var(--ink)}
.tt .c{justify-content:flex-start;padding:4px 8px;background:var(--blk);color:var(--ink);flex-direction:column;align-items:flex-start;line-height:1.3;gap:0}
.tt .c small{color:var(--mut);font-weight:400;font-size:11px}
.tt .c.k{opacity:.6}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:6px 56px}
.pf label{color:var(--mut);display:block;margin-top:14px;font-size:13px}
.pf input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 14px;margin-top:6px}
.pf input:disabled{border-color:transparent;opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.cf{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:28px;color:var(--mut)}
.cf .pri{width:300px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@media (max-width:860px){
.shell{grid-template-columns:1fr}
nav{flex-direction:row;padding:10px 12px;overflow-x:auto;gap:6px;border-right:0;border-bottom:1px solid var(--line)}
nav a:before{content:""}
main{padding:24px 16px 48px}
.hd{padding:0 16px;gap:12px}.hd .s{display:none}
.grid3,.q,.filt,.pf{grid-template-columns:1fr}
.q{gap:12px}
.cf .pri,.pri{width:100%}
}
</style>
</head>

sel.forEach(function(i){g(i).n++});
var F={q:"",dept:"",gr:"",type:""};
var NAV=[["dash","首頁儀表板"],["search","課程查詢"],["table","我的課表"],["mine","已選課程"],["prof","個人資料"]];
function route(){var h=(location.hash||"").replace("#","");return NAV.some(function(n){return n[0]===h})?h:"dash"}
function head(){return '<div class="hd"><b>Schedify</b><span class="s">學生選課系統</span><div class="u"><span>'+esc(prof[0][1]||prof[1][1])+'</span><i></i><span>114 學年度第 2 學期</span><button data-a="out">登出</button></div></div>'}
function login(){return '<div class="login"><form class="lcard" id="lf"><div class="logo">S</div><p class="bn">Schedify</p><p class="bs">課表選課系統</p><h1>歡迎回來！</h1><p class="d">登入帳號以管理你的課程與每週課表</p><label for="acc">學生帳號</label><input class="in" id="acc" placeholder="請輸入學生帳號" autocomplete="username"><label for="pw">密碼</label><input class="in" id="pw" type="password" placeholder="請輸入密碼" autocomplete="current-password"><div class="err" id="err"></div><div class="row"><label style="font-weight:400;margin:0"><input type="checkbox"> 記住帳號</label><a href="#" data-a="forgot">忘記密碼？</a></div><button class="go" type="submit">登入</button><p class="foot">© 2026 Schedify · Your Schedule, Your Way.</p></form></div>'}
function dash(){var n=sel.length;return '<h2>學生儀表板</h2><p class="sub">歡迎回來！這裡是你的本學期修課概況。</p><div class="card info"><div><span>學號：'+esc(prof[1][1])+'</span><span>系級：'+esc(prof[2][1])+'</span><span>年級：'+esc(prof[3][1])+'</span></div><span class="pill">114-2 學期</span></div><div class="grid3"><div class="card"><span style="color:var(--mut)">本學期修課學分</span><div class="big">'+cr()+' 學分</div></div><div class="card"><span style="color:var(--mut)">已選課程數</span><div class="big">'+n+' 門</div></div><div class="card"><b>選課開放時間公告</b><p style="color:var(--mut);margin:8px 0 0">加退選：114 年 2 月 17 日至 3 月 2 日<br>每學期學分上限 '+MAXC+' 學分</p></div></div><div class="card"><b style="font-size:18px">快速功能</b><div class="q"><a href="#search"><b>課程查詢</b><small>搜尋本學期開課課程</small></a><a href="#table"><b>我的課表</b><small>查看每週上課時間</small></a><a href="#mine"><b>已選課程</b><small>確認選課與學分</small></a></div></div>'}
function opts(a,v,all){return '<option value="">'+all+'</option>'+a.map(function(x){return '<option'+(x===v?' selected':'')+'>'+x+'</option>'}).join("")}
function uniq(k){return C.map(function(c){return c[k]}).filter(function(v,i,a){return a.indexOf(v)===i})}
function rows(){var q=F.q.trim().toLowerCase();return C.filter(function(c){return(!q||(c.name+c.t+c.id).toLowerCase().indexOf(q)>-1)&&(!F.dept||c.dept===F.dept)&&(!F.gr||c.gr===F.gr)&&(!F.type||c.type===F.type)})}
function search(){return '<h2>課程查詢</h2><p class="sub">搜尋課程並依照系所、年級與課程類別篩選。</p><div class="filt"><div><label for="fq">課程名稱</label><input id="fq" data-f="q" value="'+esc(F.q)+'" placeholder="輸入課程關鍵字"></div><div><label for="fd">系所</label><select id="fd" data-f="dept">'+opts(uniq("dept"),F.dept,"全部系所")+'</select></div><div><label for="fg">年級</label><select id="fg" data-f="gr">'+opts(["一年級","二年級","三年級","四年級"],F.gr,"全部年級")+'</select></div><div><label for="ft">課程類別</label><select id="ft" data-f="type">'+opts(["必修","選修"],F.type,"必修／選修")+'</select></div></div><h3 style="margin:0 0 12px">搜尋結果</h3><div class="card tw" id="res"></div>'}
function resHtml(){var r=rows();if(!r.length)return '<p style="color:var(--mut)">找不到符合的課程，請調整篩選條件。</p>';return '<table><tr><th>課程名稱</th><th>系所／年級</th><th>類別</th><th>授課教師</th><th>上課時間</th><th>學分</th><th>操作</th></tr>'+r.map(function(c){var on=sel.indexOf(c.id)>-1,full=!on&&c.n>=c.cap;return '<tr><td class="nm">'+esc(c.name)+'</td><td>'+c.dept+' '+c.gr+'</td><td>'+c.type+'</td><td>'+esc(c.t)+'</td><td>'+when(c)+'</td><td>'+c.cr+'</td><td>'+(on?'<button class="btn on" data-drop="'+c.id+'">已加選・退選</button>':'<button class="btn" data-add="'+c.id+'"'+(full?' disabled':'')+'>'+(full?'額滿':'＋ 加選')+'</button>')+'</td></tr>'}).join("")+'</table>'}
function table(){var h='<div class="tt"><div class="h">節次</div>'+[1,2,3,4,5].map(function(d){return '<div class="h">'+DAYS[d]+'</div>'}).join("");for(var p=1;p<=10;p++){h+='<div class="h">第 '+p+' 節</div>';for(var d=1;d<=5;d++){var hit=sel.map(g).filter(function(c){return c.day===d&&c.s<=p&&p<c.s+c.l})[0];h+=hit?(p===hit.s?'<div class="c"><b>'+esc(hit.name)+'</b><small>'+esc(hit.room)+'</small></div>':'<div class="c k"></div>'):'<div></div>'}}h+='</div>';var bad=false;sel.forEach(function(i){if(clash(g(i)))bad=true});
return '<h2>我的課表</h2><p class="sub">每週課程一覽，系統會協助檢查上課時間是否衝堂。</p><div class="bar"><span class="pill">114-2 學期</span><b>衝堂檢查：'+(bad?'發現衝堂':'目前無衝堂')+'</b></div><div class="tw">'+h+'</div>'}
function mine(){var c=cr();return '<h2>已選課程</h2><p class="sub">管理已加選的課程、學分統計與選課結果。</p><div class="card bar" style="min-height:90px;margin-bottom:22px"><b>已選課程：'+sel.length+' 門</b><b style="font-size:22px;color:var(--brand)">總學分：'+c+' 學分</b></div><div class="card tw">'+(sel.length?'<table><tr><th>課程名稱</th><th>任課教師</th><th>上課地點</th><th>學分</th><th>操作</th></tr>'+sel.map(function(i){var x=g(i);return '<tr><td class="nm">'+esc(x.name)+'</td><td>'+esc(x.t)+'</td><td>'+esc(x.room)+'</td><td>'+x.cr+'</td><td><button class="btn" data-drop="'+x.id+'">退選</button></td></tr>'}).join("")+'</table>':'<p style="color:var(--mut)">目前沒有已選課程，請到「課程查詢」加選。</p>')+'</div><div style="text-align:right;margin-top:28px"><button class="pri" data-a="ok">'+(confirmed?'已確認選課結果':'確認選課結果')+'</button></div>'}
function prof_(){return '<h2>個人資料</h2><p class="sub">查看並更新你的學生基本資訊。</p><div class="card" style="padding:34px 40px"><div class="pf">'+[0,1,2,3,4,5,6].map(function(i){var k=[0,4,1,5,2,6,3][i];return '<div><label for="p'+k+'">'+prof[k][0]+'</label><input id="p'+k+'" data-p="'+k+'" value="'+esc(prof[k][1])+'"'+(editing?'':' disabled')+'></div>'}).join("")+'</div><div class="cf"><span>個人資料如需變更，請確認資訊正確後再儲存。</span><button class="pri" data-a="edit">'+(editing?'儲存個人資訊':'修改個人資訊')+'</button></div></div>'}
function draw(){
  var app=document.getElementById("app");
  if(!user){app.innerHTML=login();return}
  var r=route(),v={dash:dash,search:search,table:table,mine:mine,prof:prof_}[r]();
  app.innerHTML=head()+'<div class="shell"><nav>'+NAV.map(function(n){return '<a href="#'+n[0]+'"'+(n[0]===r?' class="on" aria-current="page"':'')+'>'+n[1]+'</a>'}).join("")+'</nav><main class="wide">'+v+'</main></div>';
  if(r==="search")document.getElementById("res").innerHTML=resHtml();
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-add],[data-drop],[data-a]");if(!t)return;
  if(t.dataset.add)add(t.dataset.add);else if(t.dataset.drop)drop(t.dataset.drop);
  else if(t.dataset.a==="out"){user=false;save();draw()}
  else if(t.dataset.a==="forgot"){e.preventDefault();toast("請洽教務處註冊組重設密碼")}
  else if(t.dataset.a==="ok"){var c=cr();if(c<9){toast("目前 "+c+" 學分，至少需修 9 學分才能確認")}else{confirmed=true;save();draw();toast("已確認選課結果，共 "+c+" 學分")}}
  else if(t.dataset.a==="edit"){if(editing){document.querySelectorAll("[data-p]").forEach(function(i){prof[+i.dataset.p][1]=i.value});editing=false;save();draw();toast("個人資料已儲存")}else{editing=true;draw()}}
});
document.addEventListener("input",function(e){var f=e.target.dataset.f;if(!f)return;F[f]=e.target.value;document.getElementById("res").innerHTML=resHtml()});
document.addEventListener("submit",function(e){e.preventDefault();var a=document.getElementById("acc").value.trim(),p=document.getElementById("pw").value,nu=false;if(!a||!p){document.getElementById("err").textContent="請輸入學生帳號與密碼";return}if(a!==prof[1][1]){sel.forEach(function(i){g(i).n--});sel=["IM201","IM202","IM245","IM230"];sel.forEach(function(i){g(i).n++});confirmed=false;prof[0][1]="";prof[1][1]=a;nu=true;editing=true}user=true;save();location.hash=nu?"prof":"dash";draw();if(nu)toast("第一次登入，請先填寫姓名");});
window.addEventListener("hashchange",draw);
draw();
</script>
</body>
</html>
